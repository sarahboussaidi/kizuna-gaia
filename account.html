<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mon compte — GAIA</title>
<meta name="description" content="Connexion et création de compte GAIA pour les agriculteurs, les coopératives et les partenaires.">
<meta name="theme-color" content="#1F3A2B">
<link rel="icon" href="images/icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=DM+Sans:wght@400;500;600;700&family=Noto+Serif+JP:wght@400;600&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="platform.css">
<style>
  .acc { display: grid; grid-template-columns: minmax(0, 460px) minmax(0, 1fr); gap: 22px; align-items: start; }
  @media (max-width: 900px) { .acc { grid-template-columns: 1fr; } }
  .acc-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border-radius: 999px; background: var(--g-sand-soft); margin-bottom: 16px; }
  .acc-tabs button { min-height: 40px; border: 0; border-radius: 999px; background: transparent; font: 700 14px var(--g-sans); color: var(--g-ink-2); cursor: pointer; }
  .acc-tabs button[aria-selected="true"] { background: linear-gradient(145deg, #24432F, #0F1C15); color: #F3EEE2; }
  .acc-form { display: grid; gap: 12px; }
  .acc-form .gp-btn { width: 100%; margin-top: 6px; }
  .acc-roles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .acc-roles button { text-align: start; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--g-line-2); background: #fff; cursor: pointer; font: 600 13.5px var(--g-sans); color: var(--g-ink-2); }
  .acc-roles button[aria-pressed="true"] { border-color: var(--g-gold); box-shadow: 0 0 0 3px rgba(217, 184, 106, .25); background: #FFFBEF; color: var(--g-ink); }
  .acc-side { display: grid; gap: 12px; }
  .acc-why li { margin-top: 6px; }
  .acc-profile { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .acc-av { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; font: 800 24px var(--g-display); background: linear-gradient(145deg, #EBD08E, #B8954F); color: #0F1C15; }
  .acc-kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr)); gap: 10px; margin-top: 14px; }
  .acc-kv div { background: var(--g-ivory); border-radius: 12px; padding: 10px 12px; min-width: 0; overflow-wrap: anywhere; }
  .acc-kv b { display: block; font-size: 12px; color: var(--g-ink-3); }
  .acc-pw { position: relative; }
  .acc-pw input { width: 100%; padding-inline-end: 80px; }
  .pay-sim { font-size: 12px; font-weight: 700; border-radius: 999px; padding: 3px 10px; background: var(--s-demo-bg); color: var(--s-demo); justify-self: start; }
  .acc-demo-code { display: grid; gap: 6px; padding: 12px 14px; border-radius: 12px; background: var(--g-sand-soft); font-size: 13.5px; color: var(--g-ink-2); }
  .acc-demo-code b { font: 800 30px var(--g-display); letter-spacing: .25em; color: var(--g-forest); }
  .acc-link { border: 0; background: none; padding: 4px 0; font: 600 13.5px var(--g-sans); color: var(--g-gold-ink); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; margin-top: 8px; }
  .acc-link:hover { color: var(--g-forest); }
  .acc-farm { border: 1px solid var(--g-line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 10px; background: var(--g-ivory); }
  .acc-farm h3 { font-size: 15px; }
  .acc-check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--g-ink-2); cursor: pointer; }
  .acc-check input { margin-top: 3px; width: 18px; height: 18px; accent-color: #24432F; flex-shrink: 0; }
  .acc-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 160px), 1fr)); gap: 10px; }
  .acc-main { display: grid; gap: 16px; }
  .nb-radius { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .nb-radius button { min-height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--g-line-2); background: #fff; font: 600 13px var(--g-sans); cursor: pointer; color: var(--g-ink-2); }
  .nb-radius button[aria-pressed="true"] { background: #24432F; color: #F3EEE2; border-color: #24432F; }
  .nb-list { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 10px; }
  .nb-item { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; align-items: start; padding: 12px 14px; border: 1px solid var(--g-line); border-radius: 14px; background: #fff; }
  .nb-item.matched { border-color: rgba(47, 107, 69, .4); background: #F4F8F1; }
  .nb-item.received { border-color: var(--g-gold); background: #FFFBEF; }
  .nb-av { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; background: var(--g-sage-soft); color: var(--g-forest); grid-row: span 2; }
  .nb-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
  .nb-top b { font-size: 15px; }
  .nb-meta { font-size: 13px; color: var(--g-ink-3); }
  .nb-fit { font-size: 13.5px; color: var(--g-ink-2); margin-top: 2px; }
  .nb-act { grid-column: 2; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 6px; }
  .nb-contact { font-weight: 700; color: var(--s-ok); overflow-wrap: anywhere; }
  .acc-pw button { position: absolute; inset-inline-end: 6px; top: 50%; transform: translateY(-50%); border: 0; background: transparent; cursor: pointer; font-size: 13px; color: var(--g-ink-3); padding: 6px; }
</style>
<script src="js/a11y.js" defer></script>
</head>
<body class="gp">
<main id="main" class="wrap">
  <header class="gp-head">
    <p class="eyebrow">GAIA ACCOUNT</p>
    <h1><span data-i18n="ac_title">Mon compte</span><span class="jp-mark">縁</span></h1>
    <p class="lead" data-i18n="ac_lead">Un compte pour retrouver votre exploitation : agriculteur, coopérative, agronome ou partenaire.</p>
  </header>
  <div id="app"></div>
</main>
<script src="js/gaia-core.js"></script>
<script src="js/i18n-data.js"></script>
<script src="js/nexus-core.js"></script>
<script src="js/account.js"></script>
</body>
</html>
