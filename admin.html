<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administration — GAIA</title>
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1F3A2B">
<link rel="icon" href="images/icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="platform.css">
<style>
  .ad-filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr)); gap: 10px 14px; align-items: end; }
  .ad-row { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; }
  .ad-filters > .ad-row { grid-column: 1 / -1; }
  .ad-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); gap: 12px; margin-top: 12px; }
  .ad-kpi { background: #fff; border: 1px solid var(--g-line); border-radius: 14px; padding: 14px 16px; display: grid; gap: 2px; align-content: start; }
  .ad-kpi .l { font-size: 13.5px; color: var(--g-ink-2); }
  .ad-kpi b { font: 700 34px/1.15 var(--g-display); color: var(--g-forest); }
  .ad-kpi .s { font-size: 13px; color: var(--g-ink-3); }
  .ad-grid { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 16px; margin-top: 16px; align-items: start; }
  .ad-col { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 16px; align-items: start; }
  @media (max-width: 900px) { .ad-grid { grid-template-columns: minmax(0, 1fr); } }
  .ad-grid h2, .gp-card h2 { font-size: 18px; }
  .ad-map svg { display: block; width: 100%; max-width: 320px; height: auto; margin: 10px auto 0; }
  .ad-map .land { fill: var(--g-sand-soft); stroke: var(--g-line-2); stroke-width: 1; }
  .ad-map .hit { fill: transparent; }
  .ad-map .pt { fill: #2F6B45; stroke: #fff; stroke-width: 2; }
  .ad-map .dot { cursor: default; outline: none; }
  .ad-map .dot:hover .pt, .ad-map .dot:focus .pt { fill: #0F1C15; stroke: var(--g-gold); }
  .ad-bars { display: grid; gap: 6px; margin-top: 12px; }
  .ad-bar { display: grid; grid-template-columns: minmax(84px, 38%) minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 14px; color: var(--g-ink-2); border-radius: 6px; padding: 3px 0; }
  .ad-bar .b { height: 12px; }
  .ad-bar .b i { display: block; height: 100%; min-width: 3px; background: #2F6B45; border-start-end-radius: 4px; border-end-end-radius: 4px; }
  .ad-bar .v { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--g-ink); min-width: 2ch; text-align: end; }
  .ad-tag { margin-inline-start: 6px; font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--g-sand-soft); color: var(--g-gold-ink); }
  .ad-fb { list-style: none; margin: 10px 0 0; padding: 0; }
  .ad-fb li { padding: 10px 0; border-top: 1px solid var(--g-line); overflow-wrap: anywhere; }
  .ad-fb p { margin: 2px 0 0; }
  .ad-gate { max-width: 560px; display: grid; gap: 14px; }
</style>
<script src="js/a11y.js" defer></script>
</head>
<body class="gp">
<main id="main" class="wrap">
  <header class="gp-head">
    <p class="eyebrow">GAIA ADMIN</p>
    <h1><span data-i18n="ad_title">Administration</span><span class="jp-mark">統</span></h1>
    <p class="lead" data-i18n="ad_lead">Toutes les exploitations inscrites sur GAIA. Réservé aux administrateurs, en lecture seule.</p>
  </header>
  <div id="app"></div>
</main>
<script src="js/gaia-core.js"></script>
<script src="js/i18n-data.js"></script>
<script src="js/tunisia.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
