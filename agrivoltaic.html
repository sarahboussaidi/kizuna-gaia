<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agrivoltaïsme — GAIA</title>
<meta name="description" content="Simulez des panneaux surélevés au-dessus de votre parcelle : électricité estimée, ombre au sol, lumière restante pour la culture, mois par mois.">
<meta name="theme-color" content="#1F3A2B">
<link rel="icon" href="images/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=DM+Sans:wght@400;500;600;700&family=Noto+Serif+JP:wght@400;600&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="platform.css">
<style>
  .av { display: grid; grid-template-columns: minmax(0, 330px) minmax(0, 1fr); gap: 18px; align-items: start; }
  @media (max-width: 1000px) { .av { grid-template-columns: 1fr; } }
  .av-in { position: sticky; top: 84px; }
  @media (max-width: 1000px) { .av-in { position: static; } }
  .rng { margin-top: 14px; }
  .rng .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .rng label { font-size: 13px; font-weight: 600; color: var(--g-ink-2); }
  .rng output { font-family: var(--g-display); font-weight: 600; font-size: 18px; color: var(--g-forest); }
  body.gp[dir="rtl"] .rng output { font-family: var(--g-ar); }
  .rng input[type="range"] { width: 100%; accent-color: var(--g-forest); min-height: 32px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
  .kpi { background: var(--g-paper); border: 1px solid var(--g-line); border-radius: 12px; padding: 12px 14px; }
  .kpi b { display: block; font-size: 12px; color: var(--g-ink-3); font-weight: 600; }
  .kpi .v { font-family: var(--g-display); font-size: 25px; font-weight: 600; color: var(--g-forest); }
  body.gp[dir="rtl"] .kpi .v { font-family: var(--g-ar); }
  .kpi .u { font-size: 12.5px; color: var(--g-ink-3); }
  .xs-wrap { background: linear-gradient(#EAF0F2, #F7F4EC 70%); border-radius: 12px; border: 1px solid var(--g-line); }
  .xs-ctl { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; margin-top: 10px; }
  .xs-ctl label { font-size: 13px; font-weight: 600; color: var(--g-ink-2); display: inline-flex; gap: 8px; align-items: center; }
  .xs-ctl select, .xs-ctl input { min-height: 36px; }
  .insight { border-inline-start: 3px solid var(--g-gold); padding: 8px 12px; background: var(--s-adapt-bg); color: var(--g-gold-ink); border-radius: 0 8px 8px 0; font-size: 14px; }
  body.gp[dir="rtl"] .insight { border-radius: 8px 0 0 8px; }
  /* GAIA Solar Brain */
  .ai-box { margin-bottom: 18px; border: 1.5px solid var(--g-gold); background: linear-gradient(180deg, #FFFBF0, var(--g-paper) 220px); }
  .ai-hero h2 { font-size: clamp(22px, 3vw, 30px); margin-top: 4px; }
  .ai-lead { color: var(--g-ink-2); max-width: 820px; margin-top: 6px; font-size: 15px; }
  .ai-ctl { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin: 12px 0; }
  .ai-ctl label { font-size: 13px; font-weight: 600; color: var(--g-ink-2); display: inline-flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .ai-ctl select { min-height: 38px; }
  .ai-jp { flex-wrap: nowrap !important; background: #FBEFEF; border: 1px solid #E9C9C9; color: #7A2E2E !important; padding: 6px 10px; border-radius: 10px; max-width: 520px; }
  .ai-jp input { width: 18px; height: 18px; accent-color: #BC002D; }
  .ai-jp-h { color: var(--g-ink-3); max-width: 820px; margin-top: -4px; }
  .ai-seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--g-line-2); border-radius: 10px; overflow: hidden; }
  .ai-seg button { border: 0; background: var(--g-paper); min-height: 38px; padding: 0 12px; font: 600 13px var(--g-sans); color: var(--g-ink-2); cursor: pointer; border-inline-end: 1px solid var(--g-line); }
  .ai-seg button:last-child { border-inline-end: 0; }
  .ai-seg button[aria-checked="true"] { background: var(--g-forest); color: #fff; }
  .ai-alpha input { width: 150px; accent-color: var(--g-forest); }
  .ai-opt { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  @media (max-width: 1000px) { .ai-opt { grid-template-columns: 1fr; } }
  .ai-plot { background: var(--g-paper); border: 1px solid var(--g-line); border-radius: 12px; padding: 6px; }
  .ai-res { background: #FFF8E6; border: 1px solid #E8D3A0; border-radius: 12px; padding: 14px; }
  .ai-res.idle { background: var(--g-paper); border-style: dashed; border-color: var(--g-line-2); color: var(--g-ink-2); }
  .ai-res .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ai-res .kpi .v { font-size: 21px; }
  .ai-win { background: #F3F7EE; }
  .ai-win th { color: var(--g-forest); }
  .ai-bar { display: block; height: 8px; border-radius: 4px; background: var(--g-sand-soft); overflow: hidden; }
  .ai-bar i { display: block; height: 100%; border-radius: 4px; }
  .ai-log { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
  .ai-log li { font-size: 13.5px; color: var(--g-ink-2); display: flex; gap: 8px; align-items: baseline; }
  .ai-log li i { flex: 0 0 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .ai-net-tag { display: inline-block; margin-inline-start: 8px; font-size: 11px; font-weight: 700; letter-spacing: .02em; padding: 1px 8px; border-radius: 999px; background: linear-gradient(145deg, #EBD08E, #B8954F); color: #0F1C15; vertical-align: middle; white-space: nowrap; }
  .ai-net { margin-top: 18px; }
  .ai-net-facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 8px; margin-top: 10px; }
  .ai-net-facts div { background: var(--g-ivory); border: 1px solid var(--g-line); border-radius: 12px; padding: 10px 12px; display: grid; gap: 2px; font-size: 13.5px; min-width: 0; }
  .ai-net-facts b { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--g-gold-ink); }
</style>
<script src="js/a11y.js" defer></script>
</head>
<body class="gp">
<main id="main" class="wrap">
  <header class="gp-head">
    <p class="eyebrow">GAIA AGRIVOLTAIC · M3</p>
    <h1><span data-i18n="a_title">Agrivoltaïsme</span><span class="jp-mark">ソーラーシェアリング</span></h1>
    <p class="lead" data-i18n="a_lead">Réglez la hauteur, l'espacement, l'inclinaison et l'orientation des panneaux : GAIA estime l'électricité produite et la lumière qui reste pour la culture, mois par mois.</p>
  </header>
  <div id="app"></div>
</main>
<script src="js/gaia-core.js"></script>
<script src="js/i18n-data.js"></script>
<script src="js/landdna.js"></script>
<script src="js/solar-core.js"></script>
<script src="js/nexus-core.js"></script>
<script src="js/guard-core.js"></script>
<script src="js/agv-net.js"></script>
<script src="js/agv-ai-core.js"></script>
<script src="js/agv-ai.js"></script>
<script src="js/agrivoltaic.js"></script>
</body>
</html>
