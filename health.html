<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Santé des plantes — GAIA</title>
<meta name="description" content="Diagnostic visuel des feuilles d'olivier, de palmier dattier et d'agrumes : contrôle de qualité de la photo, identification de l'arbre, maladie probable, confiance et refus de répondre quand le modèle n'est pas sûr.">
<meta name="theme-color" content="#1F3A2B">
<link rel="icon" href="images/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=DM+Sans:wght@400;500;600;700&family=Noto+Serif+JP:wght@400;600&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="platform.css">
<style>
  .hl { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 18px; align-items: start; }
  @media (max-width: 960px) { .hl { grid-template-columns: 1fr; } }
  .drop {
    border: 1.5px dashed var(--g-line-2); border-radius: var(--g-r); background: var(--g-paper);
    min-height: 260px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    padding: 24px; text-align: center; transition: background .2s, border-color .2s;
  }
  .drop.over { background: var(--g-sage-soft); border-color: var(--g-forest); }
  .drop img { max-width: 100%; max-height: 340px; border-radius: 10px; display: block; }
  .drop .btns { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .pipe { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .step { background: var(--g-paper); border: 1px solid var(--g-line); border-radius: var(--g-r); padding: 14px 16px; }
  .step-h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .step-h .n { width: 26px; height: 26px; border-radius: 50%; background: var(--g-ivory); border: 1px solid var(--g-line-2); display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; color: var(--g-ink-2); flex-shrink: 0; }
  .step-h h3 { font-family: var(--g-sans); font-size: 15.5px; color: var(--g-ink); margin-inline-end: auto; }
  .step-b { margin-top: 10px; font-size: 14px; color: var(--g-ink-2); }
  .qgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-top: 10px; }
  .qitem { border: 1px solid var(--g-line); border-radius: 10px; padding: 9px 11px; background: var(--g-ivory); }
  .qitem b { display: block; font-size: 12px; color: var(--g-ink-3); font-weight: 600; }
  .qitem .v { font-family: var(--g-display); font-size: 18px; font-weight: 600; }
  .qitem .s { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 700; margin-top: 2px; }
  .qitem .s svg { width: 13px; height: 13px; }
  .qitem.pass .s { color: var(--s-ok); } .qitem.warn .s { color: var(--s-adapt); } .qitem.fail .s { color: var(--s-no); }
  .probs { display: grid; gap: 6px; margin-top: 10px; }
  .prob { display: grid; grid-template-columns: 150px minmax(0, 1fr) 56px; gap: 10px; align-items: center; font-size: 13.5px; }
  .prob .bar { height: 8px; border-radius: 4px; background: var(--g-sand-soft); overflow: hidden; }
  .prob .bar i { display: block; height: 8px; border-radius: 4px; background: var(--g-forest); }
  .prob .p { text-align: end; font-variant-numeric: tabular-nums; }
  .unsure { border-radius: var(--g-r); padding: 18px; background: var(--s-unk-bg); color: var(--s-unk); }
  .unsure h3 { font-family: var(--g-sans); font-size: 17px; color: var(--s-unk); }
  .boundary code { background: var(--g-ivory); padding: 1px 6px; border-radius: 5px; font-size: 13px; }
  .boundary pre { background: var(--g-charcoal); color: #E8E4D8; padding: 14px; border-radius: 10px; overflow-x: auto; font-size: 12.5px; line-height: 1.5; direction: ltr; text-align: left; }
  .kz form { display: grid; gap: 10px; margin-top: 12px; }
  .queue { font-size: 13.5px; color: var(--g-ink-2); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
  .wabi { font-family: var(--g-jp); color: var(--g-gold); }
</style>
<script src="js/a11y.js" defer></script>
</head>
<body class="gp">
<main id="main" class="wrap">
  <header class="gp-head">
    <p class="eyebrow">GAIA VISION · M2</p>
    <h1><span data-i18n="h_title">Santé des plantes</span><span class="jp-mark">侘寂</span></h1>
    <p class="lead" data-i18n="h_lead">Photographiez une feuille d'olivier, d'agrume, de palmier dattier, de vigne, de tomate, de pomme de terre ou de poivron. GAIA vérifie d'abord la photo, reconnaît la plante, puis donne la maladie probable — ou dit qu'il n'est pas sûr.</p>
  </header>
  <div id="app"></div>
</main>
<script src="js/gaia-core.js"></script>
<script src="js/i18n-data.js"></script>
<script src="js/lab-llm.js"></script>
<script src="js/health-llm.js"></script>
<script src="js/health.js"></script>
</body>
</html>
