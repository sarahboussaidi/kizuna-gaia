<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Lab — GAIA</title>
<meta name="description" content="Posez vos questions sur votre parcelle. GAIA répond à partir de ses fiches sourcées et du profil LAND DNA, avec confiance, sources et informations manquantes.">
<meta name="theme-color" content="#1F3A2B">
<link rel="icon" href="images/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=DM+Sans:wght@400;500;600;700&family=Noto+Serif+JP:wght@400;600&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="platform.css">
<style>
  .lab { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 20px; align-items: start; }
  .ctx { position: sticky; top: 84px; display: grid; gap: 12px; }
  .ctx .kvs { display: grid; gap: 6px; font-size: 13.5px; margin-top: 8px; }
  .ctx .kvs div { display: flex; justify-content: space-between; gap: 10px; }
  .ctx .kvs b { font-weight: 600; }
  .qs { display: grid; gap: 6px; }
  .qs button { text-align: start; border: 1px solid var(--g-line); background: #fff; border-radius: 10px; padding: 9px 12px; min-height: 40px; font: 13.5px var(--g-sans); cursor: pointer; color: var(--g-ink-2); }
  body.gp[dir="rtl"] .qs button { font-family: var(--g-ar); }
  .qs button:hover { background: var(--g-sand-soft); }
  .thread { display: grid; gap: 16px; min-height: 300px; }
  .q { justify-self: end; max-width: 80%; background: var(--g-forest); color: var(--g-ivory); padding: 10px 14px; border-radius: 14px 14px 4px 14px; font-size: 15px; }
  body.gp[dir="rtl"] .q { border-radius: 14px 14px 14px 4px; }
  .ans { background: var(--g-paper); border: 1px solid var(--g-line); border-radius: var(--g-r); padding: 20px; }
  .ans h3 { font-size: 19px; }
  .ans .sec { margin-top: 14px; }
  .ans .sec h4 { margin: 0 0 4px; font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--g-ink-3); }
  body.gp[dir="rtl"] .ans .sec h4 { letter-spacing: 0; }
  .ans .sec p, .ans .sec li { font-size: 14.5px; color: var(--g-ink-2); }
  .ans ul, .ans ol { margin: 4px 0 0; padding-inline-start: 18px; }
  .ans .reco { font-family: var(--g-display); font-size: 18px; color: var(--g-forest); }
  body.gp[dir="rtl"] .ans .reco { font-family: var(--g-ar); }
  .composer { position: sticky; bottom: 0; background: linear-gradient(transparent, var(--g-ivory) 30%); padding: 20px 0 16px; margin-top: 10px; }
  .composer form { display: flex; gap: 8px; background: #fff; border: 1px solid var(--g-line-2); border-radius: 14px; padding: 6px; box-shadow: var(--g-shadow); }
  .composer input { flex: 1; border: 0; font: 15.5px var(--g-sans); padding: 0 10px; min-height: 44px; background: transparent; }
  body.gp[dir="rtl"] .composer input { font-family: var(--g-ar); }
  .composer input:focus { outline: none; }
  .mode { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--g-ink-3); margin-top: 8px; }
  @media (max-width: 900px) { .lab { grid-template-columns: 1fr; } .ctx { position: static; } }
</style>
</head>
<body class="gp">
<main id="main" class="wrap">
  <header class="gp-head">
    <p class="eyebrow">GAIA AI LAB</p>
    <h1><span data-i18n="lab_title">Le centre d'intelligence</span><span class="jp-mark">知</span></h1>
    <p class="lead" data-i18n="lab_lead">Posez une question sur votre parcelle. Chaque réponse montre la recommandation, la fiche qui la justifie, les données utilisées, la confiance et ce qui manque.</p>
  </header>
  <div id="app"></div>
</main>
<script src="js/gaia-core.js"></script>
<script src="js/i18n-data.js"></script>
<script src="js/kb.js"></script>
<script src="js/kb-i18n.js"></script>
<script src="js/landdna.js"></script>
<script src="js/engine-core.js"></script>
<script src="js/lab-retrieval.js"></script>
<script src="js/lab.js"></script>
</body>
</html>
