<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Farm Agent — GAIA</title>
<meta name="description" content="L'agent agricole de GAIA planifie, appelle les outils de GAIA (Land DNA, eau, nappe, Solar Brain, météo, risques de maladie) et rend un plan d'action daté.">
<meta name="theme-color" content="#1F3A2B">
<link rel="icon" href="images/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=DM+Sans:wght@400;500;600;700&family=Noto+Serif+JP:wght@400;600&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="platform.css">
<style>
  .ag-top { display: grid; gap: 12px; }
  .ag-lab { font-weight: 600; font-size: 14px; }
  .ag-form textarea { width: 100%; box-sizing: border-box; border: 1px solid var(--g-line-2); border-radius: 12px; padding: 12px 14px; font: 16px var(--g-sans); resize: vertical; margin-top: 6px; background: #fff; }
  body.gp[dir="rtl"] .ag-form textarea { font-family: var(--g-ar); }
  .ag-row { display: flex; justify-content: flex-end; margin-top: 8px; }
  .ag-ex { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .ag-ex button { border: 1px solid var(--g-line); background: #fff; border-radius: 999px; padding: 7px 12px; min-height: 36px; font: 13px var(--g-sans); cursor: pointer; color: var(--g-ink-2); text-align: start; }
  body.gp[dir="rtl"] .ag-ex button { font-family: var(--g-ar); }
  .ag-ex button:hover { background: var(--g-sand-soft); }
  .ag-mode { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .ag-chip { font-size: 12.5px; padding: 4px 10px; border-radius: 999px; background: var(--g-sand-soft); color: var(--g-ink-2); font-weight: 600; }
  .ag-chip.server { background: #E3EEDD; color: #234A2E; }
  .ag-chip.browser { background: #E6ECF5; color: #23395B; }
  .ag-h { font-size: 18px; margin: 0 0 10px; }
  .ag-main { margin-top: 18px; padding: clamp(18px, 3vw, 34px); }
  .ag-main .ag-h { font-size: 24px; margin-bottom: 14px; }
  .ag-plan { max-width: 72ch; }
  .ag-now { font-size: 16px; color: var(--g-ink-2); }
  .ag-sit { font-size: 16.5px; line-height: 1.65; color: var(--g-ink-2); margin: 0 0 20px; }
  .ag-acts { margin: 0; padding: 0; list-style: none; display: grid; }
  .ag-acts li { padding: 18px 0; border-top: 1px solid var(--g-line); }
  .ag-when { display: flex; justify-content: space-between; gap: 12px; margin: 0; font-size: 13.5px; font-weight: 600; color: var(--g-gold-ink); }
  .ag-src { font-weight: 500; color: var(--g-ink-3); }
  .ag-lead { font-family: var(--g-display); font-size: 19px; line-height: 1.35; font-weight: 600; color: var(--g-forest); margin: 4px 0 0; }
  .ag-txt { font-size: 16px; line-height: 1.65; color: var(--g-ink-2); margin: 4px 0 0; }
  body.gp[dir="rtl"] .ag-lead { font-family: var(--g-ar); }
  .ag-how { margin-top: 14px; }
  .ag-how > summary { cursor: pointer; font-weight: 600; color: var(--g-ink-2); }
  .ag-checks { list-style: none; margin: 12px 0 0; padding: 0; }
  .ag-checks li { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 2px 14px; padding: 8px 0; border-top: 1px solid var(--g-line); font-size: 14.5px; color: var(--g-ink-2); }
  .ag-checks li b { color: var(--g-ink); font-weight: 600; }
  .ag-checks li span { unicode-bidi: plaintext; text-align: start; }
  .ag-checks li.thought { display: block; color: var(--g-ink-3); }
  @media (max-width: 560px) { .ag-checks li { grid-template-columns: 1fr; } }
  .ag-watch h4 { margin: 20px 0 6px; font-size: 17px; color: var(--g-forest); }
  .ag-watch ul { margin: 0; padding-inline-start: 18px; font-size: 15.5px; line-height: 1.65; color: var(--g-ink-2); }
  .ag-tools { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .ag-plan .llm-text p, .ag-plan .llm-text li { font-size: 16px; line-height: 1.65; margin-top: 8px; }
  .ag-plan mark.unv { background: #fde7b0; border-radius: 3px; padding: 0 2px; }
</style>
<script src="js/a11y.js" defer></script>
</head>
<body class="gp">
<main id="main" class="wrap">
  <header class="gp-head">
    <p class="eyebrow">GAIA FARM AGENT</p>
    <h1><span data-i18n="ag_title">Agent agricole</span><span class="jp-mark">策</span></h1>
    <p class="lead" data-i18n="ag_lead">Donnez un objectif. L'agent planifie, appelle les outils de GAIA et vous rend un plan d'action daté.</p>
  </header>
  <div id="app"></div>
</main>
<script src="js/gaia-core.js"></script>
<script src="js/i18n-data.js"></script>
<script src="js/kb.js"></script>
<script src="js/kb-i18n.js"></script>
<script src="js/soil-tn.js"></script>
<script src="js/soil-grid-tn.js"></script>
<script src="js/climate-core.js"></script>
<script src="js/climate-tn.js"></script>
<script src="js/landdna.js"></script>
<script src="js/engine-core.js"></script>
<script src="js/nexus-core.js"></script>
<script src="js/guard-core.js"></script>
<script src="js/solar-core.js"></script>
<script src="js/business-core.js"></script>
<script src="js/agv-net.js"></script>
<script src="js/agv-ai-core.js"></script>
<script src="js/lab-retrieval.js"></script>
<script src="js/lab-llm.js"></script>
<script src="js/ndvi.js"></script>
<script src="js/soil-plan.js"></script>
<script src="js/agent-tools.js"></script>
<script src="js/agent.js"></script>
</body>
</html>
