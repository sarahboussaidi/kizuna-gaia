<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compatibilité — GAIA</title>
<meta name="description" content="Chaque technique japonaise ou tunisienne évaluée sur six dimensions de faisabilité pour votre parcelle, avec les raisons des refus et les sources.">
<meta name="theme-color" content="#1F3A2B">
<link rel="icon" href="images/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=DM+Sans:wght@400;500;600;700&family=Noto+Serif+JP:wght@400;600&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="platform.css">
<style>
  .sum { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
  .sum .gp-card { padding: 14px 16px; }
  .sum .n { font-family: var(--g-display); font-size: 30px; font-weight: 600; color: var(--g-forest); }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin: 22px 0 14px; }
  .filters button { border: 1px solid var(--g-line-2); background: #fff; border-radius: 999px; min-height: 36px; padding: 0 14px; font: 600 13.5px var(--g-sans); cursor: pointer; color: var(--g-ink-2); }
  .filters button[aria-pressed="true"] { background: var(--g-forest); color: var(--g-ivory); border-color: var(--g-forest); }
  .tech { display: grid; gap: 14px; }
  .tcard { background: var(--g-paper); border: 1px solid var(--g-line); border-radius: var(--g-r); padding: 20px; }
  .tcard.v-adapt { border-inline-start: 0; box-shadow: inset 0 3px 0 var(--s-adapt); }
  .tcard.v-feasible { box-shadow: inset 0 3px 0 var(--s-ok); }
  .tcard.v-rejected { box-shadow: inset 0 3px 0 var(--s-no); }
  .tcard.v-insufficient { box-shadow: inset 0 3px 0 var(--s-unk); }
  .thead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
  .thead h3 { font-size: 21px; margin-inline-end: auto; }
  .thead .jp { color: var(--g-gold); font-size: 15px; margin-inline-start: 8px; }
  .dims { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; margin-top: 14px; }
  .dim { border-radius: 9px; padding: 8px 10px; font-size: 12.5px; background: var(--g-ivory); border: 1px solid var(--g-line); }
  .dim b { display: block; font-size: 12px; color: var(--g-ink-3); font-weight: 600; margin-bottom: 3px; }
  .dim span { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; }
  .dim span svg { width: 13px; height: 13px; }
  .dim.pass span { color: var(--s-ok); } .dim.fail span { color: var(--s-no); } .dim.partial span { color: var(--s-adapt); }
  .dim.unknown span, .dim.info span, .dim.none span { color: var(--s-unk); }
  .tcols { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin-top: 16px; }
  .tcols h4 { margin: 0 0 6px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--g-ink-3); }
  .tcols ul, .tcols ol { margin: 0; padding-inline-start: 18px; font-size: 14px; color: var(--g-ink-2); }
  .tcols li { margin-top: 4px; }
  .score { font-family: var(--g-display); font-size: 22px; font-weight: 600; color: var(--g-forest); }
  .rej { display: grid; gap: 6px; font-size: 14px; }
  @media (max-width: 760px) { .dims { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
</style>
</head>
<body class="gp">
<main id="main" class="wrap">
  <header class="gp-head">
    <p class="eyebrow">GAIA REASONING · M1</p>
    <h1><span data-i18n="e_title">Moteur de compatibilité</span><span class="jp-mark">絆</span></h1>
    <p class="lead" data-i18n="e_lead">Chaque technique est testée sur six dimensions. Une condition obligatoire non remplie écarte la technique, sauf si sa fiche prévoit une adaptation.</p>
  </header>
  <div id="app"></div>
</main>
<script src="js/gaia-core.js"></script>
<script src="js/i18n-data.js"></script>
<script src="js/kb.js"></script>
<script src="js/kb-i18n.js"></script>
<script src="js/landdna.js"></script>
<script src="js/engine-core.js"></script>
<script src="js/engine-page.js"></script>
</body>
</html>
